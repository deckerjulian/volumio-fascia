name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [14, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --omit=dev
      - name: Syntax check
        run: for f in index.js lib/*.js app/*.js test/*.js; do node --check "$f"; done
      - run: npm test
